<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shalom Home cover</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;800&family=Unbounded:wght@700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* DEV cover ratio 1000x420, rendered at 2x. */
  body { width: 2000px; height: 840px; overflow: hidden; background: #0c0f0c; font-family: 'Outfit', sans-serif; color: #fff; position: relative; }
  .glow { position: absolute; border-radius: 50%; }
  .g1 { width: 1700px; height: 1700px; left: -520px; top: -900px; background: radial-gradient(circle, #2E7D3266 0%, #2E7D3200 60%); }
  .g2 { width: 1400px; height: 1400px; left: 1050px; top: -80px; background: radial-gradient(circle, #C6282855 0%, #C6282800 60%); }
  .copy { position: absolute; left: 120px; top: 50%; transform: translateY(-50%); width: 1020px; }
  .brand { display: flex; align-items: center; gap: 34px; }
  .brand img { width: 150px; height: 150px; border-radius: 22%; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
  .wordmark { white-space: nowrap; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 92px; letter-spacing: -.01em; line-height: 1; }
  .head { font-weight: 800; font-size: 56px; line-height: 1.12; letter-spacing: -.015em; margin-top: 52px; }
  .head em { font-style: normal; color: #7ee08a; white-space: nowrap; }
  .tags { display: flex; gap: 16px; margin-top: 44px; flex-wrap: wrap; }
  .tag { border: 2px solid rgba(255,255,255,.22); border-radius: 999px; padding: 12px 26px; font-size: 28px; font-weight: 600; color: rgba(255,255,255,.85); }
  .phone { position: absolute; width: 380px; height: 822px; border-radius: 52px; background: #0c0d10; box-shadow: 0 40px 110px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.09) inset; }
  .screen { position: absolute; inset: 13px; border-radius: 42px; overflow: hidden; }
  .screen img { width: 100%; height: 100%; object-fit: cover; }
  .p1 { left: 1230px; top: 120px; transform: rotate(-6deg); z-index: 1; }
  .p2 { left: 1530px; top: 40px; transform: rotate(5deg); z-index: 2; }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="copy">
    <div class="brand">
      <img src="assets/shalom/icon.png" alt="">
      <div class="wordmark">Shalom Home</div>
    </div>
    <div class="head">A home screen my grandpa <em>can't mess up.</em><br>And he can just talk to it.</div>
    <div class="tags">
      <span class="tag">Whisper + Gemma, on the phone</span>
      <span class="tag">Hebrew &amp; French</span>
      <span class="tag">No internet</span>
    </div>
  </div>
  <div class="phone p1"><div class="screen"><img src="assets/shalom/home.png" alt=""></div></div>
  <div class="phone p2"><div class="screen"><img src="assets/shalom/confirm.png" alt=""></div></div>
</body>
</html>
